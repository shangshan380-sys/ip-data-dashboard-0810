.channel-nav{position:sticky;top:67px;z-index:35;background:rgba(243,246,251,.93);backdrop-filter:blur(10px);padding:12px 22px 8px}

.main{padding:14px 22px 28px;max-width:1550px;margin:auto}
.channel-page{display:none}.channel-page.active{display:block}
.channel-layout{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:16px;align-items:start}
.data-col{min-width:0}.strategy-col{position:sticky;top:138px}
.card{background:linear-gradient(155deg,#fff,#fbfcff);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}
.section{margin-bottom:15px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.kpi{min-height:106px}.kpi span{display:block;font-size:8px;color:var(--muted)}.kpi b{display:block;font-size:24px;margin:10px 0 6px;letter-spacing:-.6px}.kpi small{font-size:8px;color:#8d98a7;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chart-wrap{min-height:280px}.chart-wrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:8px;color:var(--muted);margin-top:8px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%}
.table-wrap{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;font-size:9px}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{background:#fafbfd;color:#7a8798;position:sticky;top:0}
.ptag{display:inline-block;color:#fff;padding:3px 6px;border-radius:999px;font-size:8px;font-weight:900}
.topic{display:inline-block;background:#eef2f7;padding:3px 6px;border-radius:999px;font-size:8px;color:#607086}

.ring-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.ring-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.ring{--p:0;--c:#4f7ef7;width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#edf1f6 0);display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}.ring b{position:relative;z-index:2;font-size:11px}.ring-info span{font-size:8px;color:var(--muted)}.ring-info strong{display:block;font-size:16px;margin:4px 0}.ring-info small{font-size:8px;color:#8b96a5}
.big-ring-layout{display:grid;grid-template-columns:145px 1fr;gap:15px;align-items:center}.big-ring{--p:0;--c:#4f7ef7;width:136px;height:136px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#edf1f6 0);position:relative;display:flex;align-items:center;justify-content:center}.big-ring:before{content:"";position:absolute;inset:15px;border-radius:50%;background:#fff;box-shadow:0 8px 20px rgba(40,60,90,.08)}.big-ring .center{position:relative;z-index:2;text-align:center}.big-ring .center b{display:block;font-size:26px}.big-ring .center span{font-size:8px;color:var(--muted)}
.platform-mini-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.platform-mini{border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center;background:#fbfcfe}.platform-mini .mini{--p:0;--c:#4f7ef7;width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#edf1f6 0);display:flex;align-items:center;justify-content:center;position:relative;margin:auto}.platform-mini .mini:before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}.platform-mini .mini b{position:relative;z-index:2;font-size:9px}.platform-mini span{display:block;font-size:8px;color:#6b788c;margin-top:5px;font-weight:800}

.rank-list{display:grid;gap:4px}.rank-item{display:grid;grid-template-columns:25px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.rank-item:last-child{border-bottom:0}.rank-no{width:24px;height:24px;border-radius:8px;background:#eef3fa;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900}.rank-item:nth-child(1) .rank-no{background:#ffe8a8;color:#936716}.rank-item:nth-child(2) .rank-no{background:#e7ebf1}.rank-item:nth-child(3) .rank-no{background:#f2d1b7}.rank-title{font-size:9px;line-height:1.45;min-width:0}.ellipsis{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}.rank-value{font-size:10px;font-weight:900}.rank-bar{height:4px;background:#edf1f6;border-radius:999px;overflow:hidden;margin-top:5px}.rank-bar i{display:block;height:100%;border-radius:999px}

.strategy-panel{padding:0;overflow:hidden}.strategy-head{padding:15px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#f7faff,#fff)}.strategy-head h2{font-size:13px;margin:0}.strategy-head p{font-size:8px;color:var(--muted);margin:4px 0 0}
.strategy-body{padding:13px;max-height:calc(100vh - 190px);overflow:auto}.strategy-block{border:1px solid var(--line);background:#fbfcfe;border-radius:12px;padding:11px;margin-bottom:10px}.strategy-block h3{font-size:10px;margin:0 0 8px}.strategy-block label{display:block;font-size:8px;color:#6f7b8d;margin:7px 0 4px}.strategy-block textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:9px;resize:vertical;line-height:1.55}.strategy-block .signal{background:#f2f5f9;border-radius:9px;padding:8px;font-size:8px;color:#5f6e82;line-height:1.6;margin-bottom:7px}.strategy-block .signal strong{color:#2f4057}
.strategy-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;position:sticky;bottom:0;background:#fff;padding-top:8px}.strategy-actions button{border:0;border-radius:9px;padding:9px;color:#fff;font-size:9px;font-weight:900}.strategy-actions .save{background:#4f7ef7}.strategy-actions .ai{background:#7b6fe0}
.strategy-output{margin-top:9px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:8px;line-height:1.65;white-space:pre-wrap}

.private-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.private-kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.private-kpi span{display:block;font-size:8px;color:var(--muted)}.private-kpi b{display:block;font-size:22px;margin:7px 0}.private-kpi small{font-size:8px;color:#8b96a5;line-height:1.45}
.need-row{margin:10px 0}.need-head{display:flex;justify-content:space-between;font-size:9px}.need-track{height:8px;background:#edf1f6;border-radius:999px;overflow:hidden;margin:5px 0}.need-track i{display:block;height:100%;border-radius:999px}.need-row p{font-size:8px;color:#7a8798;line-height:1.5;margin:0}
.question-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.question{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.question p{font-size:9px;color:#5d6b80;line-height:1.6;margin:6px 0 0}

.product-funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.funnel-step{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;position:relative}.funnel-step:not(:last-child):after{content:"→";position:absolute;right:-9px;top:38%;color:#aab4c0;font-weight:900}.funnel-step span{font-size:8px;color:var(--muted)}.funnel-step b{display:block;font-size:21px;margin:8px 0}.funnel-step small{font-size:8px;color:#8a96a6}

.tooltip{position:fixed;pointer-events:none;z-index:100;background:#172235;color:#fff;padding:8px 10px;border-radius:8px;font-size:8px;opacity:0;transform:translate(-50%,-110%)}
@media(max-width:1200px){.channel-layout{grid-template-columns:1fr}.strategy-col{position:static}.strategy-body{max-height:none}.kpi-grid,.ring-grid{grid-template-columns:repeat(2,1fr)}}

.live-data-status{

}
.live-data-status b{display:block;font-size:10px;color:#315fae}
.live-data-status span{font-size:8px;color:#7d899a}
.live-status-platforms{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}

.global-custom span,.range-hint{font-size:8px;color:#8491a3}.range-hint{white-space:nowrap}
.platform-pill:disabled{opacity:.3;cursor:not-allowed}
.live-chart-grid{display:grid;grid-template-columns:1fr;gap:12px}
.live-mini-chart{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fcfdff}
.mini-chart-title{font-size:9px;font-weight:900;color:#506077;margin:0 0 4px}
.node-flow .funnel-step:not(:last-child):after{content:""}
.section-head p,.kpi small,.strategy-block label,.strategy-block .signal,.private-kpi small,.need-row p{font-size:9px}
.strategy-block textarea{font-size:10px}
.anomaly-note{color:#b94f5d;font-weight:800}
@media(max-width:900px){.range-hint{display:none}.global-custom{width:100%}}

document.querySelectorAll(".platform-pill").forEach(b=>b.addEventListener("click",()=>{if(b.disabled)return;setPlatform(b.dataset.platform);renderShort();renderLive()}));
globalPeriod.addEventListener("change",()=>{globalCustom.classList.toggle("show",globalPeriod.value==="custom");updateRangeHint();renderShort();renderLive()});
globalStart.addEventListener("change",()=>{updateRangeHint();renderShort();renderLive()});
globalEnd.addEventListener("change",()=>{updateRangeHint();renderShort();renderLive()});
shortMonthSelect.addEventListener("change",renderShort);
liveMonthSelect.addEventListener("change",renderLive);
document.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",()=>saveReview(b.dataset.save)));
document.querySelectorAll("[data-ai]").forEach(b=>b.addEventListener("click",()=>aiReview(b.dataset.ai)));
refreshData.addEventListener("click",async()=>{await loadDashboardData();rerenderDashboard()});
openUpload.addEventListener("click",()=>{cloudModal.hidden=false;uploadResult.textContent="等待上传"});
closeUpload.addEventListener("click",()=>{cloudModal.hidden=true});
cloudModal.addEventListener("click",e=>{if(e.target===cloudModal)cloudModal.hidden=true});
downloadCurrentData.addEventListener("click",()=>downloadJson(currentDashboardPayload()));
submitUpload.addEventListener("click",async()=>{
  try{
    if(!dataFiles.files.length)throw new Error("请选择数据文件");
    uploadResult.textContent="正在解析文件...";
    const {payload,summary}=await parseDataFiles(dataFiles.files);
    uploadResult.textContent="正在写入云端...";
    await uploadPayload(payload,adminPassword.value);
    applyDashboardPayload(payload);
    rerenderDashboard();
    setCloudStatus("云端数据 · "+(META.asOf||"已同步"),"ok");
    uploadResult.textContent="上传成功。\n"+summary;
  }catch(err){
    uploadResult.textContent=err.message||String(err);
  }
});
bootDashboard();
</script>
</body>
</html>
